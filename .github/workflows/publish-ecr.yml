name: Publish and deploy frontend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prepare-ecr-ecs

permissions:
  contents: read

concurrency:
  group: publish-frontend-ecr
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish frontend image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/prepare-ecr-ecs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '533267145144' }}
      ECR_REPOSITORY: library-ng

    outputs:
      image: ${{ steps.image-reference.outputs.image }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate EC2 deploy scripts
        shell: bash
        run: |
          chmod +x ec2/deploy-frontend.sh ec2/deploy-to-instance.sh
          sh -n ec2/deploy-frontend.sh
          sh -n ec2/deploy-to-instance.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account and create ECR repository if needed
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Could not determine the AWS account ID."
            exit 1
          fi
          if [[ -n "$EXPECTED_AWS_ACCOUNT_ID" && "$account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::Credentials point to account $account_id, not $EXPECTED_AWS_ACCOUNT_ID."
            exit 1
          fi
          echo "AWS_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

          if ! repositories="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" 2>&1)"; then
            if [[ "$repositories" != *"RepositoryNotFoundException"* ]]; then
              echo "$repositories"
              exit 1
            fi
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region "$AWS_REGION"
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether the immutable image already exists
        id: existing-image
        shell: bash
        run: |
          if image="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image for this commit already exists; it will be reused."
          elif [[ "$image" == *"ImageNotFoundException"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$image" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image reference
        id: image-reference
        shell: bash
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy-ec2:
    name: Deploy frontend to EC2 through Systems Manager
    needs: publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/prepare-ecr-ecs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: library-frontend-ec2-deployment
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_URI: ${{ needs.publish.outputs.image }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployment target
        shell: bash
        run: |
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::Set the EC2_INSTANCE_ID Actions variable to the managed EC2 instance ID (after creating the EC2 stack)."
            exit 1
          fi

      - name: Deploy image and smoke-test the EC2 website
        shell: bash
        run: >-
          bash ec2/deploy-to-instance.sh
          "$EC2_INSTANCE_ID"
          "$AWS_REGION"
          frontend
          ec2/deploy-frontend.sh
          "$IMAGE_URI"
          "$AWS_REGION"
