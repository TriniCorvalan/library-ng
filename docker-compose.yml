services:
  library:
    build:
      context: ../library
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../library/.env
    environment:
      TNS_ADMIN: /app/wallet
    volumes:
      - ../library/Wallet_TG243BR3UDTANBR0:/app/wallet:ro
    restart: unless-stopped

  library-ng:
    build: .
    ports:
      - "8088:80"
    depends_on:
      - library
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
